<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paid Seminar - Frontend Prototype</title>
  <style>
    :root{
      --bg:#f3f4f6;--surface:#fff;--line:#e5e7eb;--line-soft:#eef1f4;
      --text:#111827;--muted:#6b7280;--brand:#36b24a;--brand-dark:#23963a;
      --teal:#0f5a60;--danger:#ef4444;--success-bg:#eefaf0;
      --shadow:0 2px 8px rgba(17,24,39,.04)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);background:var(--bg)}
    .top-line{height:8px;background:var(--teal)}
    .site-header{background:#fff;border-bottom:1px solid #d9dde3}
    .site-header .inner,.page-wrap{width:min(1220px,calc(100% - 32px));margin:0 auto}
    .site-header .inner{height:76px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-weight:700;line-height:1;color:#4ab44f;font-size:24px;letter-spacing:-.3px}
    .logo small{display:block;color:#8a919c;font-size:10px;font-weight:600;letter-spacing:.4px;margin-top:4px}
    .header-actions{display:flex;align-items:center;gap:20px;font-size:13px}
    .link-btn{color:#1f2937;text-decoration:none}
    .pill-btn{border:0;padding:7px 14px;background:var(--brand);color:#fff;border-radius:999px;font-size:12px;font-weight:700}
    .page-wrap{padding:26px 0 42px}
    .module-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line)}
    .module-tab{border:0;background:transparent;padding:12px 18px;font-size:15px;font-weight:800;color:#6b7280;border-bottom:3px solid transparent}
    .module-tab.active{color:var(--brand-dark);border-bottom-color:var(--brand)}

    /* second-level tabs inside frontend */
    .front-subtabs{
      width:430px;max-width:100%;margin:0 auto 12px;
      display:flex;gap:6px;padding:6px;background:#eef0f2;border:1px solid #e1e5ea;border-radius:14px
    }
    .front-subtab{
      flex:1;border:0;background:transparent;color:#6b7280;border-radius:10px;padding:10px 8px;
      font-size:12px;font-weight:800;cursor:pointer
    }
    .front-subtab.active{background:#fff;color:var(--brand-dark);box-shadow:0 1px 4px rgba(17,24,39,.08)}
    .front-subview{display:none}
    .front-subview.active{display:block}

    /* Exact current Paid Seminar frontend */
    #registration-flow{
      width:430px;max-width:100%;margin:0 auto;min-height:820px;background:#f6f7f9;
      border:1px solid #e1e5ea;border-radius:30px;overflow:hidden;box-shadow:0 24px 60px rgba(17,24,39,.14);
      position:relative
    }
    .front-step{display:none;min-height:820px;background:#f6f7f9}
    .front-step.active{display:block}
    .event-preview{max-width:none;min-height:820px;position:relative;background:#fff;overflow:hidden}
    .event-preview:after{content:"";position:absolute;inset:0;background:rgba(31,41,55,.34);z-index:1;pointer-events:none}
    .event-hero{background:#dcd9b9;padding:28px 24px 24px;border-radius:0}
    .event-hero-kicker{font-size:11px;font-weight:800;color:#1f2937;letter-spacing:.12em;margin-bottom:10px}
    .event-hero h2{margin:0 0 12px;font-size:34px;line-height:1.15;color:#17212c}
    .event-hero h3{margin:0 0 18px;font-size:17px;color:#17212c;letter-spacing:.12em}
    .event-chip{display:inline-block;background:#20883d;color:#fff;border-radius:999px;padding:8px 16px;font-size:12px;font-weight:800}
    .event-body{background:#fff;padding:26px 24px 230px;border:0}
    .event-body h3{margin:0 0 12px;font-size:25px;line-height:1.5;color:#17212c}
    .proxy-badge{display:inline-block;background:#e8f4ea;color:#238441;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;margin:4px 0 18px}
    .event-meta{display:grid;gap:14px;font-size:14px;color:#263244}
    .event-meta-row{display:flex;gap:12px;align-items:flex-start}
    .event-meta-icon{width:20px}
    .entry-sheet{
      position:absolute;left:0;right:0;bottom:0;z-index:3;margin:0;padding:18px 18px 22px;
      border:0;border-radius:28px 28px 0 0;box-shadow:0 -14px 38px rgba(17,24,39,.10);background:#fff
    }
    .sheet-handle{width:58px;height:5px;border-radius:999px;background:#dbe1e8;margin:0 auto 18px}
    .entry-sheet h3{margin:0 0 8px;font-size:22px}
    .entry-sub{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:16px}
    .entry-choice{
      display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #dfe5eb;background:#fff;
      border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.16s ease
    }
    .entry-choice:hover{border-color:#a7d9af;background:#fbfffb}
    .entry-choice strong{display:block;font-size:16px;color:#111827;margin-bottom:4px}
    .entry-choice span{font-size:13px;color:#7b8796}
    .entry-icon{font-size:22px;line-height:1}
    .entry-cancel{display:block;margin:14px auto 0;border:0;background:transparent;color:#7b8796;font-size:14px}

    /* Existing proxy-registration page */
    #proxyRegistrationPage{padding:0 0 84px;background:#f5f6f8}
    .back-entry{
      width:100%;height:56px;margin:0;padding:0 18px;background:#fff;border:0;border-bottom:1px solid var(--line);
      text-align:left;font-size:13px;color:#374151;position:sticky;top:0;z-index:5;cursor:pointer
    }
    .front-layout{display:block;width:100%;margin:0}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .form-card{border:0;border-radius:0;box-shadow:none;padding:22px 18px 26px;background:#f5f6f8}
    .form-title{font-size:19px;line-height:1.45;margin:0 0 8px;font-weight:800}
    .form-subtitle{font-size:12px;line-height:1.65;margin:0 0 16px;color:var(--muted)}
    .inline-info{display:flex;gap:8px;align-items:flex-start;border:1px solid #5b9dff;border-radius:12px;padding:12px;font-size:12px;color:#375a7f;background:#f8fbff;margin-bottom:16px}
    .note-icon{width:16px;height:16px;border-radius:50%;background:#3b82f6;color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 16px;margin-top:1px}
    .payment-method{margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .payment-title{font-size:14px;font-weight:800;color:#1f2937;margin-bottom:12px}
    .payment-options{display:grid;gap:10px}
    .payment-option{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid #dfe5eb;border-radius:12px;background:#fff;cursor:pointer}
    .payment-option.active{border-color:var(--brand);background:var(--success-bg)}
    .payment-option input{margin-top:2px;accent-color:var(--brand)}
    .payment-option-copy{font-size:12px;line-height:1.5;color:#374151}
    .payment-option-copy strong{display:block;color:#1f2937;font-size:13px;margin-bottom:2px}
    .payment-hint{color:#6b7280}
    .add-client-bar{display:block;padding:14px;border:1px solid #dfe5eb;border-radius:14px;margin-bottom:12px;background:#f8faf9}
    .add-client-copy{font-size:12px;color:#6b7280;line-height:1.5}
    .add-client-copy strong{display:block;color:#263244;font-size:13px;margin-bottom:2px}
    .add-client-btn{width:100%;margin-top:10px;height:42px;border:1px solid var(--brand);background:#fff;color:var(--brand-dark);border-radius:12px;font-size:12px;font-weight:800;cursor:pointer}
    .client-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 10px;margin-bottom:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
    .client-tabs::-webkit-scrollbar{display:none}
    .client-tab{flex:0 0 auto;border:1px solid #d7dde5;background:#fff;color:#4b5563;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer}
    .client-tab.active{border-color:var(--brand);background:var(--success-bg);color:var(--brand-dark)}
    .client-card{display:none;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .client-card.active{display:block}
    .client-card-title{font-size:14px;font-weight:800;color:#1f2937;margin-bottom:16px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field{margin-bottom:14px}
    .label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:#374151}
    .required:before{content:"* ";color:var(--danger);font-weight:800}
    .input,.select,.textarea{width:100%;height:46px;border:1px solid #d5dbe3;border-radius:10px;padding:0 12px;background:#fff;font-size:14px;color:#111827;outline:none}
    .textarea{height:82px;padding:10px 12px;resize:vertical}
    .select{appearance:none}
    .email-field{display:none}.email-field.show{display:block}
    .section-divider{height:1px;background:var(--line);margin:18px 0}
    .custom-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:14px}
    .chip{display:inline-block;background:#e5f6e8;color:#23963a;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}
    .summary-card{position:static;width:calc(100% - 36px);margin:14px 18px 0;border-radius:16px;border:1px solid #dde3e9;box-shadow:none;background:#fff;overflow:hidden}
    .summary-body{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;height:66px}
    .summary-row,.summary-total{margin:0;padding:0;border:0;display:block;font-size:10px;color:#7b8490}
    .summary-row span,.summary-total span{display:block}
    .summary-row span:last-child,.summary-total .price{font-size:13px;color:#111827;font-weight:800;margin-top:2px}
    .submit-btn{width:112px;height:44px;margin:0;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:13px}
    .summary-title,.summary-copy,.summary-banner{display:none}

    /* External agent tab */
    #external-agent{
      width:430px;max-width:100%;margin:0 auto;background:#f6f7f9;border:1px solid #e1e5ea;border-radius:30px;
      overflow:hidden;box-shadow:0 24px 60px rgba(17,24,39,.14);min-height:820px
    }
    .external-header{background:#fff;border-bottom:1px solid #eceff2;padding:14px 16px 12px}
    .pwa-status{display:flex;align-items:center;justify-content:space-between;color:#6b7280;font-size:11px;margin-bottom:10px}
    .pwa-topline{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}
    .pwa-icon-btn{width:34px;height:34px;border:0;border-radius:10px;background:#f3f4f6;color:#374151;font-size:18px}
    .pwa-heading{text-align:center}
    .pwa-heading strong{display:block;color:#111827;font-size:16px}
    .pwa-heading span{display:block;color:#8a919c;font-size:11px;margin-top:3px}
    .external-body{padding:16px 14px 90px}
    .external-hero{background:linear-gradient(135deg,#f0fbf3 0%,#fff 62%);border:1px solid #d7eddc;border-radius:16px;padding:18px;margin-bottom:12px}
    .external-kicker{display:inline-flex;border-radius:999px;background:#dff5e3;color:#248f39;padding:5px 9px;font-size:10px;font-weight:900;margin-bottom:10px}
    .external-hero h2{margin:0 0 8px;font-size:20px;line-height:1.35}
    .external-hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
    .flow-card,.invite-card{padding:17px;margin-bottom:12px}
    .flow-title{font-size:13px;font-weight:900;margin-bottom:14px}
    .flow-step{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;padding-bottom:18px}
    .flow-step:last-child{padding-bottom:0}
    .flow-step:not(:last-child):before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:#dce6df}
    .flow-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef8f0;color:var(--brand-dark);font-size:11px;font-weight:900;border:1px solid #cfe7d4}
    .flow-step:first-child .flow-dot{background:var(--brand);color:#fff;border-color:var(--brand)}
    .flow-copy strong{display:block;font-size:12px;margin:1px 0 3px}
    .flow-copy span{display:block;font-size:11px;color:var(--muted);line-height:1.55}
    .invite-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    .invite-head strong{font-size:13px}
    .badge{font-size:9px;font-weight:900;color:#8c6500;background:#fff1bd;border-radius:999px;padding:4px 7px}
    .invite-btn{width:100%;height:42px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;cursor:pointer}
    .info{margin-top:11px;padding:10px 11px;background:#f7faf8;border-radius:10px;color:#5c665f;font-size:10px;line-height:1.6}
    .activated{display:none;gap:11px;align-items:flex-start;margin-top:12px;padding:13px;border:1px solid #d6ecd9;border-radius:12px;background:#f7fcf8}
    .check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dff5e3;color:var(--brand-dark);font-weight:900;flex:0 0 auto}
    .activated strong{font-size:12px}
    .activated span{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}

    @media(max-width:520px){
      body{background:#fff}
      .page-wrap{width:100%;padding:12px 0 0}
      .module-tabs{width:calc(100% - 24px);margin:0 auto 12px;padding:0 4px}
      .site-header{display:none}
      #registration-flow,#external-agent{width:100%;border:0;border-radius:0;box-shadow:none;min-height:calc(100vh - 110px)}
      .front-subtabs{width:calc(100% - 24px)}
    }

    /* New pre-login gate before current registration flow */
    .prelogin-screen{
      min-height:820px;
      background:#f6f7f9;
      padding:18px 14px 20px;
    }
    .prelogin-phone{
      min-height:784px;
      background:#f1f3f5;
      border-radius:28px;
      position:relative;
      overflow:hidden;
      border:1px solid #e4e7eb;
    }
    .prelogin-sheet{
      position:absolute;
      left:12px;
      right:12px;
      top:14px;
      background:#fff;
      border-radius:28px 28px 0 0;
      padding:18px 20px 26px;
      box-shadow:0 10px 30px rgba(17,24,39,.06);
      min-height:500px;
    }
    .prelogin-handle{
      width:70px;
      height:6px;
      border-radius:999px;
      background:#d8dde3;
      margin:0 auto 28px;
    }
    .prelogin-title{
      margin:0 0 14px;
      font-size:22px;
      line-height:1.35;
      font-weight:900;
      color:#1f2937;
    }
    .prelogin-subtitle{
      margin:0 0 22px;
      color:#64748b;
      font-size:13px;
      line-height:1.8;
    }
    .prelogin-choice{
      width:100%;
      display:flex;
      gap:12px;
      align-items:flex-start;
      text-align:left;
      padding:17px 16px;
      margin-bottom:12px;
      border:1px solid #d7dee7;
      border-radius:18px;
      background:#fff;
      cursor:pointer;
    }
    .prelogin-choice:hover{
      border-color:#b9d8bf;
      background:#fbfffb;
    }
    .prelogin-icon{
      font-size:22px;
      line-height:1.2;
      flex:0 0 auto;
      margin-top:1px;
    }
    .prelogin-choice strong{
      display:block;
      color:#111827;
      font-size:15px;
      margin-bottom:5px;
    }
    .prelogin-choice span:last-child{
      display:block;
      color:#64748b;
      font-size:12px;
      line-height:1.55;
    }
    .prelogin-agent-helper{
      margin:18px 0 0;
      text-align:center;
      color:#7b8796;
      font-size:12px;
      line-height:1.6;
    }
    .prelogin-agent-login{
      border:0;
      padding:0;
      background:transparent;
      color:#2aa240;
      font-size:12px;
      font-weight:900;
      text-decoration:underline;
      cursor:pointer;
    }
    .prelogin-cancel{
      display:block;
      margin:26px auto 0;
      border:0;
      background:transparent;
      color:#7b8796;
      font-size:14px;
      cursor:pointer;
    }


    /* Module pages */
    .module-panel{display:none}
    .module-panel.active{display:block}
    #frontend.module-panel.active{display:block}
    .module-content{display:block}

    .scope-page{width:min(1080px,calc(100% - 24px));margin:0 auto;display:grid;gap:16px}
    .scope-header-card,.scope-section-card{
      background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)
    }
    .scope-header-card{padding:22px}
    .scope-eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--brand-dark);margin-bottom:7px}
    .scope-header-card h1{margin:0 0 8px;font-size:24px}
    .scope-header-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
    .scope-section-card{display:grid;grid-template-columns:54px 1fr;gap:16px;padding:20px}
    .scope-section-no{
      width:42px;height:42px;border-radius:12px;background:#eef8f0;color:var(--brand-dark);
      display:grid;place-items:center;font-size:18px;font-weight:900
    }
    .scope-section-title{font-size:18px;font-weight:900;margin:2px 0 5px}
    .scope-section-desc{margin:0 0 16px;color:var(--muted);font-size:12px;line-height:1.65}
    .scope-flow{
      display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:center;
      overflow-x:auto;padding-bottom:4px
    }
    .scope-flow-step{
      min-width:160px;border:1px solid #dfe5eb;border-radius:12px;background:#fbfcfd;padding:13px;
      display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start
    }
    .scope-flow-num{
      width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef8f0;
      color:var(--brand-dark);font-size:10px;font-weight:900
    }
    .scope-flow-step strong{display:block;font-size:11px;margin:1px 0 3px}
    .scope-flow-step span:last-child{display:block;color:var(--muted);font-size:10px;line-height:1.5}
    .scope-flow-arrow,.external-flow-arrow{color:#9ca3af;font-weight:900}
    .external-flow-in-scope{overflow-x:auto;padding-bottom:4px}
    .external-flow-row{display:flex;align-items:center;gap:8px;min-width:860px}
    .external-flow-node{
      flex:1;min-width:140px;border:1px solid #dfe5eb;border-radius:12px;background:#fff;padding:14px;
      display:flex;align-items:center;gap:8px
    }
    .external-flow-node span{
      width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#eef1f3;
      color:#64748b;font-size:10px;font-weight:900;flex:0 0 auto
    }
    .external-flow-node strong{font-size:11px;line-height:1.4}
    .external-flow-node.active{border-color:#b9dec1;background:#f7fcf8}
    .external-flow-node.active span,.external-flow-node.success span{background:var(--brand);color:#fff}
    .external-flow-node.success{border-color:#a7d9af;background:#eefaf0}
    .scope-detail-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
    .scope-detail-card{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfd}
    .scope-detail-card strong{display:block;font-size:10px;margin-bottom:4px}
    .scope-detail-card span{display:block;color:var(--muted);font-size:9px;line-height:1.5}
    .placeholder-panel{
      width:min(800px,calc(100% - 24px));margin:0 auto;background:#fff;border:1px solid var(--line);
      border-radius:16px;padding:24px;box-shadow:var(--shadow)
    }
    .placeholder-panel strong{display:block;font-size:16px;margin-bottom:6px}
    .placeholder-panel span{color:var(--muted);font-size:12px}

    @media(max-width:760px){
      .scope-section-card{grid-template-columns:1fr}
      .scope-detail-grid{grid-template-columns:1fr}
      .scope-flow{grid-template-columns:1fr}
      .scope-flow-arrow{transform:rotate(90deg);text-align:center}
      .external-flow-row{min-width:760px}
    }


    /* Backend - External Agent Invitation */
    .backend-external-wrap{
      width:min(760px,calc(100% - 24px));
      margin:0 auto;
      display:grid;
      gap:16px;
    }
    .backend-external-card,
    .backend-note-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:28px 30px;
    }
    .backend-external-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:26px;
    }
    .backend-external-head h2{
      margin:0;
      font-size:24px;
      font-weight:900;
      color:#111827;
    }
    .backend-role-badge{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:8px 14px;
      background:#fff0b3;
      color:#8b6200;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .backend-field{
      margin-bottom:22px;
    }
    .backend-field label{
      display:block;
      margin-bottom:10px;
      font-size:14px;
      font-weight:800;
      color:#374151;
    }
    .backend-field input{
      width:100%;
      height:52px;
      border:1px solid #d7dee7;
      border-radius:14px;
      padding:0 16px;
      font-size:15px;
      color:#111827;
      background:#fff;
      outline:none;
    }
    .backend-field input:focus{
      border-color:#9fd2a8;
      box-shadow:0 0 0 3px rgba(54,178,74,.08);
    }
    .backend-invite-btn{
      width:100%;
      height:48px;
      border:0;
      border-radius:12px;
      background:var(--brand);
      color:#fff;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
    }
    .backend-invite-help{
      margin-top:16px;
      padding:14px 16px;
      border-radius:12px;
      background:#f6f9f7;
      color:#64706a;
      font-size:12px;
      line-height:1.7;
    }
    .backend-activated{
      display:none;
      align-items:flex-start;
      gap:12px;
      margin-top:16px;
      padding:14px 16px;
      border:1px solid #cfe7d4;
      border-radius:12px;
      background:#f3fbf5;
    }
    .backend-activated-icon{
      width:30px;
      height:30px;
      border-radius:50%;
      background:#dff5e3;
      color:var(--brand-dark);
      display:grid;
      place-items:center;
      font-weight:900;
      flex:0 0 auto;
    }
    .backend-activated strong{
      display:block;
      font-size:12px;
      margin-bottom:3px;
    }
    .backend-activated span{
      display:block;
      color:var(--muted);
      font-size:10px;
    }

    .backend-note-card{
      background:#fffdf6;
      border-color:#efdfad;
    }
    .backend-note-title{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      font-weight:900;
      color:#4b3a0b;
      margin-bottom:14px;
    }
    .backend-note-icon{
      width:22px;
      height:22px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#fff0b3;
      color:#8b6200;
      font-size:12px;
      font-weight:900;
    }
    .backend-note-list{
      display:grid;
      gap:10px;
    }
    .backend-note-item{
      padding:12px 13px;
      border:1px solid #efe5c4;
      border-radius:10px;
      background:rgba(255,255,255,.7);
    }
    .backend-note-item strong{
      display:block;
      font-size:11px;
      color:#3f3a2a;
      margin-bottom:3px;
    }
    .backend-note-item span{
      display:block;
      color:#6d6757;
      font-size:10px;
      line-height:1.6;
    }

    @media(max-width:520px){
      .backend-external-card,.backend-note-card{
        padding:20px 16px;
        border-radius:0;
        border-left:0;
        border-right:0;
      }
      .backend-external-wrap{
        width:100%;
      }
      .backend-external-head h2{font-size:20px}
      .backend-role-badge{font-size:10px;padding:6px 10px}
    }


    /* Combined backend sections */
    .backend-combined-wrap{
      width:min(1120px,calc(100% - 24px));
      margin:0 auto;
      display:grid;
      gap:22px;
    }
    .backend-block{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    .backend-block-head{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
    }
    .backend-block-no{
      width:36px;height:36px;border-radius:10px;
      display:grid;place-items:center;
      background:#eef8f0;color:var(--brand-dark);
      font-size:15px;font-weight:900;flex:0 0 auto;
    }
    .backend-block-head h2{margin:0 0 4px;font-size:18px}
    .backend-block-head p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}

    .backend-shell{
      display:grid;
      grid-template-columns:200px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }
    .backend-nav{padding:14px;border-radius:12px}
    .backend-nav h3{font-size:13px;margin:0 0 12px;color:#374151}
    .backend-nav-item{
      padding:10px 11px;border-radius:6px;font-size:12px;color:#4b5563;margin-bottom:4px
    }
    .backend-nav-item.active{
      background:var(--success-bg);color:var(--brand-dark);font-weight:800
    }
    .editor-card{padding:22px;border-radius:12px}
    .editor-title{font-size:20px;font-weight:800;margin:0 0 22px;color:#17203b}
    .steps{
      display:grid;grid-template-columns:auto 1fr auto 1fr auto;
      gap:10px;align-items:center;margin-bottom:22px
    }
    .step{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b93a3;white-space:nowrap}
    .step.active{color:#1f2a44;font-weight:700}
    .dot{
      width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
      border:1px solid #cbd2dc;background:#fff
    }
    .step.done .dot{color:var(--brand);border-color:var(--brand)}
    .step.active.current .dot{background:var(--brand);color:#fff;border-color:var(--brand)}
    .bar{height:2px;background:#e6e8ec}
    .bar.done{background:var(--brand)}
    .helper{font-size:11px;color:#374151;margin-bottom:22px}
    .helper span{color:#8b93a3;margin-left:8px}
    .segmented{
      display:inline-flex;background:#f1f3f5;border:1px solid #e2e5ea;
      border-radius:6px;padding:3px
    }
    .segmented button{
      border:0;background:transparent;padding:7px 14px;font-size:12px;color:#8b93a3;
      border-radius:4px;cursor:pointer
    }
    .segmented button.active{
      background:#fff;color:#374151;box-shadow:0 1px 3px rgba(0,0,0,.06)
    }
    .editor-actions{
      display:flex;justify-content:flex-end;gap:10px;margin-top:22px;
      padding-top:17px;border-top:1px solid var(--line)
    }
    .btn{
      height:38px;border-radius:999px;padding:0 18px;border:1px solid #dfe3e9;
      background:#fff;color:#24304a;font-size:13px;cursor:pointer
    }
    .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}

    .shopify-discussion-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px
    }
    .shopify-discussion-card{
      border:1px solid var(--line);border-radius:12px;padding:16px;background:#fbfcfd
    }
    .shopify-discussion-tag{
      display:inline-flex;border-radius:999px;padding:4px 9px;font-size:9px;
      font-weight:900;margin-bottom:8px
    }
    .shopify-discussion-tag.toc{background:#edf4ff;color:#2563eb}
    .shopify-discussion-tag.tob{background:#eefaf0;color:#23963a}
    .shopify-discussion-card h3{margin:0 0 6px;font-size:13px}
    .shopify-discussion-card p{margin:0 0 10px;font-size:10px;color:var(--muted);line-height:1.6}
    .shopify-discussion-line{
      display:grid;grid-template-columns:92px 1fr;gap:6px;
      font-size:10px;line-height:1.55;margin-top:5px
    }
    .shopify-discussion-line strong{color:#374151}
    .shopify-discussion-line span{color:#66707c}

    .shopify-discussion-note{
      margin-top:12px;padding:14px 16px;border:1px solid #e4e8ec;border-radius:12px;background:#fff
    }
    .shopify-note-title{font-size:12px;font-weight:900;margin-bottom:8px}
    .shopify-note-items{display:grid;gap:6px;color:#65707b;font-size:10px;line-height:1.6}
    .shopify-note-items strong{color:#374151}

    @media(max-width:820px){
      .backend-shell{grid-template-columns:1fr}
      .backend-nav{display:none}
      .shopify-discussion-grid{grid-template-columns:1fr}
      .steps{grid-template-columns:1fr}
      .bar{display:none}
    }


    /* Original deployed scheme demo, restored under Backend / Shopify */
    .shopify-scheme-action{
      margin-top:14px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px;
      box-shadow:var(--shadow);
    }
    .shopify-scheme-action h3{
      margin:0 0 8px;
      font-size:15px;
      color:#17203b;
    }
    .shopify-scheme-action p{
      margin:0 0 16px;
      color:#6b7280;
      font-size:11px;
      line-height:1.7;
    }
    .scheme-open-btn{
      min-height:40px;
      border:1px solid #cfd8e3;
      border-radius:10px;
      background:#fff;
      color:#24304a;
      padding:0 15px;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
    }
    .scheme-open-btn:hover{
      border-color:#9fd2a8;
      background:#f8fff9;
      color:var(--brand-dark);
    }

    .scheme-modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:1000;
      background:rgba(15,23,42,.5);
      padding:28px;
      overflow:auto;
    }
    .scheme-modal.open{display:block}
    .scheme-modal-dialog{
      width:min(1040px,100%);
      margin:0 auto;
      background:#f7f8fa;
      border-radius:20px;
      box-shadow:0 28px 80px rgba(15,23,42,.25);
      overflow:hidden;
    }
    .scheme-modal-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      padding:22px 24px;
      background:#fff;
      border-bottom:1px solid #e5e7eb;
    }
    .scheme-modal-kicker{
      font-size:9px;
      font-weight:900;
      color:var(--brand-dark);
      letter-spacing:.14em;
      margin-bottom:4px;
    }
    .scheme-modal-head h2{
      margin:0;
      font-size:22px;
      color:#111827;
    }
    .scheme-modal-close{
      width:38px;height:38px;border:0;border-radius:10px;background:#f3f4f6;
      color:#374151;font-size:22px;cursor:pointer
    }
    .scheme-modal-body{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      padding:20px;
    }
    .scheme-option{
      background:#fff;
      border:1px solid #dfe4e8;
      border-radius:16px;
      padding:18px;
      min-width:0;
    }
    .scheme-option.recommended{
      border-color:#b8dfbf;
      box-shadow:0 0 0 1px rgba(54,178,74,.06);
    }
    .scheme-option-tag{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      background:#eef1f3;
      color:#64748b;
      padding:5px 9px;
      font-size:9px;
      font-weight:900;
      margin-bottom:10px;
    }
    .scheme-option.recommended .scheme-option-tag{
      background:#dff5e3;
      color:var(--brand-dark);
    }
    .scheme-option h3{
      margin:0 0 8px;
      font-size:15px;
      line-height:1.45;
      color:#17203b;
    }
    .scheme-option > p{
      margin:0 0 15px;
      color:#6b7280;
      font-size:10px;
      line-height:1.65;
    }
    .scheme-flow-mini{
      display:grid;
      gap:7px;
      margin:10px 0 14px;
    }
    .scheme-mini-node{
      display:grid;
      grid-template-columns:28px 1fr;
      gap:9px;
      align-items:center;
      padding:10px;
      border:1px solid #e2e7ec;
      border-radius:10px;
      background:#fbfcfd;
    }
    .scheme-mini-node > span{
      width:28px;height:28px;border-radius:50%;
      display:grid;place-items:center;
      background:#eef8f0;color:var(--brand-dark);
      font-size:10px;font-weight:900;
    }
    .scheme-mini-node strong{
      display:block;
      font-size:10px;
      color:#273142;
      margin-bottom:2px;
    }
    .scheme-mini-node small{
      display:block;
      color:#7b8490;
      font-size:9px;
      line-height:1.45;
    }
    .scheme-mini-arrow{
      text-align:center;
      color:#9ca3af;
      font-size:13px;
      line-height:1;
    }
    .scheme-pros-cons{
      display:grid;
      gap:8px;
    }
    .scheme-good,.scheme-warn{
      border-radius:10px;
      padding:10px 11px;
      font-size:9px;
      line-height:1.55;
    }
    .scheme-good{background:#f1faf3;color:#4e6554}
    .scheme-warn{background:#fff9ea;color:#6d6040}
    .scheme-good strong,.scheme-warn strong{
      display:block;
      color:#374151;
      font-size:9px;
      margin-bottom:2px;
    }
    .scheme-modal-foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 20px;
      background:#fff;
      border-top:1px solid #e5e7eb;
    }
    .scheme-modal-foot span{
      color:#6b7280;
      font-size:9px;
      line-height:1.55;
    }
    .scheme-modal-done{
      border:0;
      border-radius:999px;
      background:var(--brand);
      color:#fff;
      min-height:36px;
      padding:0 18px;
      font-size:10px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }
    @media(max-width:760px){
      .scheme-modal{padding:12px}
      .scheme-modal-body{grid-template-columns:1fr;padding:12px}
      .scheme-modal-dialog{border-radius:14px}
      .scheme-modal-foot{align-items:flex-start;flex-direction:column}
      .scheme-modal-done{width:100%}
    }


    /* Scope > Shopify > three payment flows */
    .shopify-three-flow-section{
      margin-top:20px;
      padding-top:18px;
      border-top:1px solid #e7ebef;
    }
    .shopify-three-flow-head{
      margin-bottom:14px;
    }
    .shopify-three-flow-head h3{
      margin:0 0 6px;
      font-size:16px;
      color:#17203b;
    }
    .shopify-three-flow-head p{
      margin:0;
      color:#6b7280;
      font-size:11px;
      line-height:1.65;
    }
    .shopify-flow-row{
      display:grid;
      grid-template-columns:130px minmax(170px,1fr) 22px minmax(170px,1fr) 22px minmax(190px,1fr) 22px minmax(190px,1fr);
      gap:8px;
      align-items:stretch;
      margin-bottom:10px;
      min-width:1050px;
    }
    .shopify-flow-row:last-child{margin-bottom:0}
    .shopify-flow-label{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      min-height:112px;
      padding:14px;
      border:1px solid #cfe7d4;
      border-radius:12px;
      background:#eef8f0;
      color:#24983a;
    }
    .shopify-flow-label strong{
      font-size:13px;
      line-height:1.2;
      margin-bottom:3px;
    }
    .shopify-flow-label span{
      font-size:12px;
      font-weight:800;
      line-height:1.35;
    }
    .shopify-flow-box{
      min-height:112px;
      padding:14px;
      border:1px solid #dfe4e8;
      border-radius:12px;
      background:#fff;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:5px;
      box-shadow:0 1px 3px rgba(17,24,39,.03);
    }
    .shopify-flow-box strong{
      display:block;
      font-size:12px;
      line-height:1.4;
      color:#111827;
    }
    .shopify-flow-box span{
      display:block;
      font-size:10px;
      line-height:1.6;
      color:#667085;
    }
    .shopify-flow-box.flow-blue{
      border-color:#bcd4ef;
      background:#f8fbff;
    }
    .shopify-flow-box.flow-green{
      border-color:#b8dfbf;
      background:#f8fff9;
    }
    .shopify-flow-box.flow-orange{
      border-color:#f2d4a8;
      background:#fffaf3;
    }
    .shopify-flow-arrow{
      display:grid;
      place-items:center;
      color:#9aa4b2;
      font-size:22px;
      font-weight:900;
    }
    .link-pill{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:3px 8px;
      font-size:9px;
      font-style:normal;
      font-weight:900;
      white-space:nowrap;
    }
    .link-pill.toc{
      background:#edf4ff;
      color:#2563eb;
    }
    .link-pill.tob{
      background:#eefaf0;
      color:#23963a;
    }
    .shopify-three-flow-section{
      overflow-x:auto;
      padding-bottom:4px;
    }

  </style>
</head>

    </div>
  </header>
